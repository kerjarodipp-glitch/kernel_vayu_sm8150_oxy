name: Build Kranol 4.14

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 6"
  push:
    branches:
      - HEAD
  pull_request:
    branches:
      - HEAD

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: "vayu_defconfig"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 100

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install dependencies & toolchain
        run: |
          sudo apt-get update -y

          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            aria2 \
            binutils \
            make \
            python3 \
            libssl-dev \
            build-essential \
            bc \
            bison \
            flex \
            unzip \
            ca-certificates \
            xz-utils \
            cpio \
            device-tree-compiler \
            git \
            git-lfs \
            curl \
            wget

          sudo apt-get install -y python2 || true

          if ! command -v python2 >/dev/null 2>&1; then
            sudo ln -sf /usr/bin/python3 /usr/bin/python2
          fi

          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git \
            google-clang

      - name: Clean previous build (full clean)
        run: |
          echo ">>> Removing previous build outputs..."
          rm -rf out

          echo ">>> Running mrproper to fully clean source tree..."
          make mrproper

      - name: GetTime
        id: get_time
        run: |
          echo "TIME=$(TZ=UTC+3 date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Kernel-With-KernelSU (with logging)
        run: |
          export PATH="$(pwd)/google-clang/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1
          export LD=ld.lld

          echo ">>> Clang version:"
          clang --version

          echo ">>> LLD version:"
          ld.lld --version

          echo ">>> Starting defconfig build..."
          make O=out \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            $KERNEL_DEFCONFIG 2>&1 | tee build_defconfig.log

          echo ">>> Starting kernel compilation (Image only)..."
          make -j"$(nproc --all)" O=out \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image 2>&1 | tee build_kernel.log

          BUILD_RESULT=${PIPESTATUS[0]}

          if [ "$BUILD_RESULT" -ne 0 ]; then
            echo "❌ Kernel build failed. Logs will be uploaded."
            exit 1
          fi

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build_Logs-${{ steps.get_time.outputs.TIME }}
          path: |
            build_defconfig.log
            build_kernel.log
            patch.log
            out/arch/arm64/boot/.config

      - name: Upload Raw Outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Raw_Kernel-${{ steps.get_time.outputs.TIME }}
          path: |
            out/arch/arm64/boot/Image
